<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ICARUS Inside Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Archivo:wght@400;600&family=Space+Mono&display=swap">
<style>
/* One-file handoff: the card that sits under the disc, with a download button. */
:root {
  --ink: #0b0a0a;
  --sheet: #151112;
  --rule: #2e2425;
  --text: #f1e8e6;
  --muted: #a99b98;
  --red: #ee242e;
  --ember: #ff7a5c;
  --display: "Bodoni Moda", "Didot", "Times New Roman", serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "Space Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ink); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.55; min-height: 100vh; display: grid; place-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { width: 100%; max-width: 760px; display: grid; gap: 18px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--red); }
h1 { font-family: var(--display); font-weight: 500; font-size: clamp(30px, 5vw, 44px); line-height: 1.05; margin: 0; letter-spacing: .03em; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: clamp(16px, 4vw, 32px); display: grid; place-items: center; }
.card img { display: block; width: 100%; max-width: 640px; height: auto; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
p { margin: 0; color: var(--muted); max-width: 60ch; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { font: 600 15px var(--body); color: #fff; background: var(--red); border: 1px solid var(--red); border-radius: 8px; padding: 11px 18px; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
.btn:hover { background: #d81d26; }
.btn:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">miinii · ICARUS keychain</div>
  <h1>Inside card (under the disc)</h1>
  <div class="card">
    <img src="ICARUS_inside-card_under-disc.png" alt="miinii reclining on a black sport bike in front of a red sun, with MIINII printed down the black strip on the left" width="730" height="524">
  </div>
  <div class="meta">53 × 38 mm · 350 dpi · 730 × 524 px · PNG</div>
  <p>Sits in the tray under the disc. The black MIINII strip goes on the hinge side.</p>
  <div class="row">
    <a class="btn" href="ICARUS_inside-card_under-disc.png" download="ICARUS_inside-card_under-disc.png">Download PNG</a>
  </div>
</main>
</body>
</html>
